# =============================================================================
# Site Information
# =============================================================================

site_name: makefile-skills

site_description: >-
  Reusable Makefile skills for versioning, Python, MkDocs, and Bash —
  adopt a thin project wrapper and pull shared make targets from this library.

site_author: The Lupaxa Project

site_url: https://makefile-skills.thelupaxaproject.org/

repo_name: the-lupaxa-blueprints/makefile-skills
repo_url: https://github.coc/the-lupaxa-blueprints/makefile-skills

extra:
  generator: false
  start_year: 2025
  footer_name: The Lupaxa Project
  footer_taglines:
    - Where exploration meets precision.
    - Where the untamed meets the engineered.
  counter_dev_id: ef410665-76d4-43fe-9e91-53f26ed1004b
  counter_dev_utcoffset: 0
  social_image: assets/images/social-card.png
  social_image_width: 1200
  social_image_height: 630
  social_logo: assets/images/logo.png
  social_locale: en_GB
  theme_color: "#203959"
  twitter_card: summary_large_image

# =============================================================================
# Content
# =============================================================================

docs_dir: mkdocs

# =============================================================================
# Theme
# =============================================================================

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png

  features:
    - content.code.copy
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - toc.follow

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  icon:
    repo: fontawesome/brands/github

# =============================================================================
# Plugins
# =============================================================================

plugins:
  - search

# =============================================================================
# Navigation
# =============================================================================

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Usage: usage.md
  - Reference: reference.md
  - Examples: examples.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: false
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences

# =============================================================================
# Additional Assets
# =============================================================================

extra_css:
  - assets/stylesheets/00-tokens.css
  - assets/stylesheets/10-base.css
  - assets/stylesheets/20-layout.css
  - assets/stylesheets/30-navigation.css
  - assets/stylesheets/40-components/buttons.css
  - assets/stylesheets/40-components/footer.css
  - assets/stylesheets/40-components/hero.css
  - assets/stylesheets/40-components/tables.css
  - assets/stylesheets/90-responsive.css
  - assets/stylesheets/95-print.css
  - assets/stylesheets/99-overrides.css

extra_javascript:
  - assets/javascript/page-lifecycle.js
  - assets/javascript/header-active-nav.js

# =============================================================================
# Copyright (rendered by overrides/partials/copyright.html; year set in-browser)
# =============================================================================
