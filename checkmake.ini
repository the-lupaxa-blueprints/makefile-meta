# checkmake configuration for makefile-skills.
#
# This repo ships skill fragments and consumer wrappers, not classic
# all/clean/test project Makefiles. Wrapper overlays intentionally redefine
# init/install/update, and doctor/status recipes are intentionally long.

[minphony]
required =

[maxbodylength]
disabled = true

[uniquetargets]
ignore = init install,update
